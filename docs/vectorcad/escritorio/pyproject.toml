[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorcad"
version = "5.0.0"
description = "Sistema de dibujo 2D vectorial paramétrico con intérprete de comandos tipo AutoCAD"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Centro de Producción del Espacio" }]
keywords = ["cad", "dxf", "vector", "drafting", "qt"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
full = ["ezdxf>=1.1", "shapely>=2.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
vectorcad = "vectorcad:main"

[project.gui-scripts]
vectorcad-gui = "vectorcad:main"

[tool.setuptools]
py-modules = ["vectorcad"]
